
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusFix</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="navbar">

        <a href="index.html"
           class="logo"
           aria-label="CampusFix home">
            Campus<span>Fix</span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="track.html">Track</a>
            <a href="login.html" aria-current="page">Login</a>
            <a href="register.html" class="nav-button">Register</a>
        </nav>

    </header>


    <!-- ================= MAIN ================= -->

    <main id="main-content">

        <section class="form-page" aria-labelledby="login-title">

            <div class="section-heading">

                <p class="tag">
                    WELCOME BACK
                </p>

                <h1 id="login-title">
                    Login.
                </h1>

                <p>
                    Login to submit complaints and
                    track their progress.
                </p>

            </div>


            <!-- ================= LOGIN FORM ================= -->

            <form
                id="loginForm"
                class="complaint-form"
                novalidate
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                        aria-describedby="email-help"
                    >

                    <small id="email-help">
                        Enter the email associated with your account.
                    </small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            minlength="6"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                    <!-- Forgot Password -->

                    <div class="forgot-password">

                        <a href="forgotpassword.html">
                            Forgot password?
                        </a>

                    </div>

                </div>


                <!-- Message -->

                <div
                    id="loginMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="primary-button submit-button"
                >
                    Login
                    <span aria-hidden="true">→</span>
                </button>

            </form>


            <!-- ================= REGISTER LINK ================= -->

            <p class="form-footer-text">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">
            Campus<span>Fix</span>
        </div>

        <p>
            A simple way to make campus better.
        </p>

        <p class="copyright">
            © 2026 CampusFix
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
